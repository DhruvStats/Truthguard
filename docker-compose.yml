version: "3.9"

services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"

  ml:
    build: ./ml
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - ML_BASE_URL=http://ml:8000
      - MONGO_URI=mongodb://mongo:27017/newsguard-ai
    depends_on:
      - mongo
      - ml

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
