services:
  mongo:
    image: mongo:6
    container_name: truthguard-mongo
    ports:
      - "27017:27017"

  ml:
    build: ./ml
    container_name: truthguard-ml
    ports:
      - "8000:8000"
    command: uvicorn infer:app --host 0.0.0.0 --port 8000

  backend:
    build: ./backend
    container_name: truthguard-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/truthguard
      - ML_BASE_URL=http://ml:8000
    depends_on:
      - ml
      - mongo
    command: node server.js

  frontend:
    build: ./frontend
    container_name: truthguard-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend
